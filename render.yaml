services:
  - type: web
    name: class-desk-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm run migrate && pnpm start
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: DATABASE_URL
        sync: false
      - key: SYNC_TOKEN
        generateValue: true
